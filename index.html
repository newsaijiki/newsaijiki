<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ニュ・歳時記</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;600&display=swap">
<style>
:root{color-scheme:light;--bg:#fff;--fg:#222;--sub:#777;--line:#e6e6e6;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;line-height:1.9}
main{max-width:640px;margin:0 auto;padding:56px 24px 96px}
h1{font-weight:400;font-size:28px;letter-spacing:.3em;text-align:center;margin:0 0 40px}
.tabs{display:flex;justify-content:center;flex-wrap:wrap;gap:4px 18px;margin-bottom:32px}
.tabs button{background:none;border:0;border-bottom:1px solid transparent;font:inherit;color:var(--sub);cursor:pointer;padding:2px 2px}
.tabs button.on{color:var(--fg);border-bottom-color:var(--fg)}
input,select,textarea{font:inherit;color:var(--fg);background:#fff;border:1px solid var(--line);border-radius:0;padding:8px 10px;inline-size:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:#999}
textarea{resize:vertical}
.btn{font:inherit;background:#fff;color:var(--fg);border:1px solid var(--fg);padding:6px 20px;cursor:pointer}
.btn:hover{background:var(--fg);color:#fff}
.link{background:none;border:0;font:inherit;font-size:13px;color:var(--sub);cursor:pointer;padding:0}
.link:hover{color:var(--fg);text-decoration:underline}
details.add{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:14px 0;margin-bottom:40px}
details.add summary{cursor:pointer;text-align:center;color:var(--sub);letter-spacing:.2em;list-style:none}
details.add summary::-webkit-details-marker{display:none}
.form{display:grid;gap:12px;margin-top:18px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row>div{min-width:0}
.row.kurow{grid-template-columns:calc((100% - 12px) * 0.6 + 1em) minmax(0,1fr)}
label{font-size:12px;color:var(--sub);display:block}
.entry{padding:28px 0 16px;border-bottom:1px solid var(--line)}
.entry h2{font-weight:600;font-size:22px;margin:0;display:inline}
.yomi{color:var(--sub);font-size:13px;margin-left:10px}
.season{float:right;font-size:12px;color:var(--sub);border:1px solid var(--line);padding:0 8px}
.kid{margin-left:18px;font-size:18px}
.kid rt{font-size:9px}
.desc{margin:10px 0 14px;font-size:17px;white-space:pre-wrap}
.ku{margin:6px 0;font-size:16px;white-space:pre-wrap}
.ku.kufirst{margin-top:26px}
.ku small{color:var(--fg);font-size:14px;margin-left:32px}
.acts{display:flex;justify-content:flex-end;margin-top:4px}
.edit{background:none;border:0;color:#aaa;cursor:pointer;padding:4px;line-height:0}
.edit:hover{color:var(--fg)}
body.v{writing-mode:vertical-rl;overflow-x:auto;overflow-y:hidden;height:100vh}
body.v main{max-width:none;margin:0;height:100vh;padding:64px 36px 32px}
body.v h1{margin:0 0 0 44px;text-align:start}
body.v .tabs{margin:0 0 0 40px;justify-content:flex-start}
body.v .tabs button{border-bottom:0;border-left:1px solid transparent}
body.v .tabs button.on{border-left-color:var(--fg)}
body.v details.add{border-top:0;border-bottom:0;border-left:1px solid var(--line);border-right:1px solid var(--line);padding:0 14px;margin:0 0 0 40px}
body.v .form{margin:0 16px 0 0;inline-size:min(100%,440px)}
body.v textarea{resize:both}
body.v #list .entry{border-bottom:0;border-left:1px solid var(--line);padding:4px 28px;height:calc(100vh - 96px)}
body.v .season{float:none;display:inline-block;margin:0 0 12px}
body.v .yomi{margin:12px 0 0}
body.v .kid{margin:12px 0 0}
body.v .desc{margin:0 14px}
body.v .ku{margin:0 6px;padding-top:0}
body.v .ku.kufirst{margin-top:0;margin-right:26px}
body.v .ku small{margin:32px 0 0}
body.v .empty{padding:0 48px}
.search{position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);right:18px;z-index:5;writing-mode:horizontal-tb;width:170px}
.search svg{position:absolute;left:0;top:50%;transform:translateY(-50%);color:var(--sub);pointer-events:none}
.search input{border:0;border-bottom:1px solid var(--line);padding:4px 4px 4px 24px;font-size:14px;background:transparent}
#list.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
#list.grid .empty{grid-column:1/-1}
.tile{position:relative;aspect-ratio:1/1;border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:14px;cursor:pointer;overflow:hidden;line-height:1.5}
.tile:hover{border-color:var(--fg)}
.tseason{position:absolute;top:6px;left:8px;font-size:11px;color:var(--sub)}
.tword{font-size:20px;font-weight:600}
.tyomi{font-size:11px;color:var(--sub)}
.tkids{margin-top:8px;font-size:13px}
.tkids .kid{margin:0 6px;font-size:13px}
body.v #list.grid{display:flex;flex-flow:row wrap;align-content:flex-start;gap:14px;height:calc(100vh - 96px)}
body.v .tile{width:150px;height:150px;aspect-ratio:auto}
body.v .tseason{left:auto;right:8px}
body.v .tkids .kid{margin:6px 0 0}
.nav{position:fixed;left:14px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:16px;z-index:6;writing-mode:horizontal-tb}
.dot{width:104px;height:104px;border-radius:50%;border:0;background:#c8372d;color:#fff;font:inherit;font-size:14px;line-height:1.3;padding:0;cursor:pointer;transition:transform .15s}
.dot:nth-child(1){background:#c8372d}
.dot:nth-child(2){background:#4f8a4b}
.dot:nth-child(3){background:#e8892b}
.dot:nth-child(4){background:#1e4a7a}
.dot:nth-child(5){background:#4a4a4a}
@media(max-height:720px) and (min-width:701px){.dot{width:80px;height:80px;font-size:12px}.nav{gap:10px}}
.dot:hover{opacity:.85}
.navtog{position:absolute;left:14px;top:calc(env(safe-area-inset-top,0px) + 14px);width:34px;height:34px;border-radius:50%;border:0;background:#222;padding:0;cursor:pointer;z-index:7;writing-mode:horizontal-tb}
body.navoff .navtog{background-color:#e0392d;background-image:linear-gradient(#fff,#fff),linear-gradient(#fff,#fff),linear-gradient(#fff,#fff);background-repeat:no-repeat;background-size:18px 2px;background-position:center 9px,center 16px,center 23px}
body.navoff .nav{display:none}
body.navoff main{padding-left:24px}
body.v.navoff main{padding-left:36px}
.dot.on{transform:scale(1.1)}
#pages h2{font-weight:600;font-size:22px;margin:0 0 16px}
#pages p{margin:0 0 14px;font-size:15px}
body.v #pages{height:calc(100vh - 96px)}
body.v #pages h2{margin:0 0 0 24px}
body.v #pages p{margin:0 0 0 14px}
body.v main{padding-left:140px}
@media(min-width:701px) and (max-width:960px){main{max-width:none;padding-left:140px}}
@media(max-width:700px){.nav{left:8px;gap:10px}.dot{width:72px;height:72px;font-size:11px}main{padding-left:96px;padding-right:16px}body.v main{padding-left:100px}}
.thumb{width:80px;height:80px;object-fit:cover;display:block;flex:none}
.entry.hasimg{display:flex;gap:18px;align-items:flex-start}
.entry.hasimg>.body{flex:1;min-width:0}
.imgprev{display:flex;gap:14px;align-items:center;margin-bottom:8px}
.crop-ov{position:fixed;inset:0;background:rgba(255,255,255,.97);z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;writing-mode:horizontal-tb}
.crop-ov canvas{width:280px;height:280px;border:1px solid var(--line);touch-action:none;cursor:grab}
.crop-ov input[type=range]{width:280px;inline-size:280px;border:0;padding:0}
.crop-ov p{margin:0;font-size:13px;color:var(--sub)}
.cmp{display:grid;grid-template-columns:4.5em 1fr 1fr;gap:6px 14px;font-size:14px;margin:8px 0 24px}
.cmp div{white-space:pre-wrap;min-width:0;word-break:break-word}
.cmp .h{color:var(--sub);font-size:12px}
.cmp .c{font-weight:600}
.hlog{margin:0 0 16px;font-size:14px;white-space:pre-wrap}
.hlog .meta{font-size:12px;color:var(--sub)}
.hh{font-weight:600;margin:22px 0 6px;font-size:15px}
.hnote{font-size:13px;color:var(--sub)}
.srcs{margin:14px 0 4px}
#list.detail .entry h2{font-size:28px}
.srchead{font-size:12px;color:var(--sub)}
.src{font-size:13px}
body.v .srcs{margin:0 14px}
.empty{text-align:center;color:var(--sub);padding:48px 0}
.foot{display:flex;gap:20px;align-items:center;margin-top:8px}
@media(max-width:480px){.row{grid-template-columns:1fr}.row.kurow{grid-template-columns:calc((100% - 12px) * 0.6 + 1em) minmax(0,1fr)}}
</style>
</head>
<body>
<button class="navtog" id="navtog" type="button" aria-label="メニューを開閉" title="メニューを開閉"></button>
<nav class="nav" id="nav"></nav>
<div class="search" id="search">
  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></svg>
  <input id="q" type="text" aria-label="検索" autocomplete="off">
</div>
<main>
  <h1>ニュ・歳時記</h1>

  <details class="add" id="addbox">
    <summary>＋ 季語を加える</summary>
    <div class="form">
      <div><label>季節</label>
        <select id="f-season"><option>春</option><option>夏</option><option>秋</option><option>冬</option><option>新年</option></select>
      </div>
      <div class="row">
        <div><label>季語</label><input id="f-word"></div>
        <div><label>読み</label><input id="f-yomi"></div>
      </div>
      <div id="f-kids"></div>
      <div><button class="link" id="f-addkid" type="button">＋ 子季語を加える</button></div>
      <div><label>解説</label><textarea id="f-desc" rows="10"></textarea></div>
      <div id="f-kus"></div>
      <div><button class="link" id="f-addrow" type="button">＋ 句を加える</button></div>
      <div id="f-srcs"></div>
      <div><button class="link" id="f-addsrc" type="button">＋ 出典を加える</button></div>
      <div id="f-img"></div>
      <div style="text-align:center"><button class="btn" id="f-save">登録する</button></div>
    </div>
  </details>

  <div class="tabs" id="tabs"></div>
  <div id="list"></div>
  <div id="pages" style="display:none"></div>
</main>

<script>
(function(){
  var SEASONS=["春","夏","秋","冬","新年"];
  var DEF=["冬","冬","春","春","春","夏","夏","夏","秋","秋","秋","冬"][new Date().getMonth()], cur=DEF, page=null, me=null, navAdmin=false, histId=null, editingId=null, vertical=false, qs="", tiles=false, openId=null;
  try{tiles=localStorage.getItem("nyu-saijiki-tiles")==="1"}catch(e){}
  var MASTER="new.saijiki.2000@gmail.com";
  try{var sv=JSON.parse(localStorage.getItem("nyu-saijiki-me")||"null");if(sv&&sv.email&&sv.id)me={id:sv.id,email:sv.email,master:sv.email===MASTER}}catch(e){}
  var userColl=null,pagesColl=null,pageTexts={},pgEditing=null,pgMaster=false;
  try{pageTexts=JSON.parse(localStorage.getItem("nyu-saijiki-pages")||"{}")}catch(e){}
  /* ===== Supabase 設定（使うときは下の2つを入れる。空のときは従来どおりの保存） ===== */
  var SB={url:"https://iknhbnbwnhesmurrcckj.supabase.co",key:"sb_publishable_6DTCmfU4sUsuT1o1AZQHww_mKEp3pX4"};   // 例: url:"https://xxxx.supabase.co", key:"（anon public key）"
  var SBON=!!(SB.url&&SB.key);
  if(SBON)SB.url=SB.url.replace(/\/rest\/v1\/?$/,"").replace(/\/+$/,"");
  function sbSess(){try{return JSON.parse(localStorage.getItem("nyu-saijiki-sb")||"null")}catch(e){return null}}
  function sbSave(s){try{if(s)localStorage.setItem("nyu-saijiki-sb",JSON.stringify(s));else localStorage.removeItem("nyu-saijiki-sb")}catch(e){}}
  function sbFrom(d){return{access:d.access_token,refresh:d.refresh_token,exp:Date.now()+(d.expires_in||3600)*1000,user:{id:d.user.id,email:d.user.email}}}
  function sbMe(s){return{id:s.user.id,email:s.user.email,master:s.user.email===MASTER}}
  if(SBON){var ss0=sbSess();me=ss0&&ss0.user?sbMe(ss0):null}
  async function sbToken(){
    var s=sbSess();if(!s)return "";
    if(s.exp-Date.now()>60000)return s.access;
    try{
      var r=await fetch(SB.url+"/auth/v1/token?grant_type=refresh_token",{method:"POST",headers:{apikey:SB.key,"Content-Type":"application/json"},body:JSON.stringify({refresh_token:s.refresh})});
      var d=await r.json();
      if(!r.ok||!d.access_token)throw 0;
      s=sbFrom(d);sbSave(s);return s.access;
    }catch(e){sbSave(null);me=null;render();return ""}
  }
  async function sbFetch(path,opt){
    opt=opt||{};
    var tk=await sbToken(),h={apikey:SB.key,"Content-Type":"application/json"};
    if(tk)h.Authorization="Bearer "+tk;
    if(opt.prefer)h.Prefer=opt.prefer;
    var r=await fetch(SB.url+path,{method:opt.method||"GET",headers:h,body:opt.body?JSON.stringify(opt.body):undefined});
    if(!r.ok)throw new Error(r.status);
    var t=await r.text();return t?JSON.parse(t):null;
  }
  function bodyOf(it){return{word:it.word,yomi:it.yomi||"",season:it.season,desc:it.desc||"",examples:it.examples||[],children:it.children||[],sources:it.sources||[],img:it.img||"",owner:it.owner||"",first:it.first||{},log:it.log||[],at:it.at}}
  async function sbLoad(){
    var rows=await sbFetch("/rest/v1/kigo?select=id,data&order=updated_at.asc");
    return rows.map(function(r){var x=r.data||{};x.id=r.id;return x});
  }
  function sbUpsert(it){
    return sbFetch("/rest/v1/kigo?on_conflict=id",{method:"POST",prefer:"resolution=merge-duplicates,return=minimal",body:[{id:it.id,data:bodyOf(it),updated_at:new Date().toISOString()}]})
      .catch(function(){alert("サーバーに保存できませんでした。通信状況と、Supabase の設定をご確認ください。")});
  }
  function sbDelete(id){
    return sbFetch("/rest/v1/kigo?id=eq."+encodeURIComponent(id),{method:"DELETE"}).catch(function(){alert("サーバーから削除できませんでした。")});
  }
  async function sbRegister(email,pw){
    var r=await fetch(SB.url+"/auth/v1/signup",{method:"POST",headers:{apikey:SB.key,"Content-Type":"application/json"},body:JSON.stringify({email:email,password:pw})});
    var d=await r.json().catch(function(){return {}});
    if(!r.ok)throw d.msg||d.error_description||d.message||"登録できませんでした。";
    if(d.access_token&&d.user){var s=sbFrom(d);sbSave(s);me=sbMe(s);return}
    throw "確認のメールを送りました。メール内のリンクを開いてから、ログインしてください。";
  }
  async function sbLogin(email,pw){
    var r=await fetch(SB.url+"/auth/v1/token?grant_type=password",{method:"POST",headers:{apikey:SB.key,"Content-Type":"application/json"},body:JSON.stringify({email:email,password:pw})});
    var d=await r.json().catch(function(){return {}});
    if(!r.ok||!d.access_token)throw "メールアドレスまたはパスワードが違います。メールの確認がまだの場合は、確認を済ませてください。";
    var s=sbFrom(d);sbSave(s);me=sbMe(s);
  }
  function sbStart(){
    var warned=false;
    function pull(first){
      sbLoad().then(function(list){
        if(first||(JSON.stringify(list)!==JSON.stringify(items)&&editingId===null)){items=list;render()}
      }).catch(function(){if(!warned){warned=true;alert("Supabase に接続できません。設定と通信状況をご確認ください。")}});
    }
    function pullPages(){
      sbFetch("/rest/v1/site_pages?select=id,body").then(function(rows){
        var m={};(rows||[]).forEach(function(r){m[r.id]=r.body});
        if(JSON.stringify(m)!==JSON.stringify(pageTexts)&&pgEditing===null){pageTexts=m;refreshPage()}
      }).catch(function(){});
    }
    pull(true);pullPages();setInterval(function(){pull(false);pullPages()},20000);
  }
  try{vertical=localStorage.getItem("nyu-saijiki-vert")==="1"}catch(e){}
  var items=[], coll=null, LS="nyu-saijiki-v1";

  function $(id){return document.getElementById(id)}
  function el(tag,cls,text){var e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e}
  function field(label,node){var d=el("div");d.appendChild(el("label","",label));d.appendChild(node);return d}

  function lsLoad(){try{return JSON.parse(localStorage.getItem(LS)||"[]")}catch(e){return []}}
  function lsSave(){if(SBON)return;try{localStorage.setItem(LS,JSON.stringify(items))}catch(e){}}

  function persist(it){
    if(coll){
      var body={word:it.word,yomi:it.yomi||"",season:it.season,desc:it.desc||"",examples:it.examples||[],children:it.children||[],sources:it.sources||[],img:it.img||"",owner:it.owner||"",first:it.first||{},log:it.log||[],at:it.at};
      return coll.doc(it.id).set(body).catch(function(){alert("保存できませんでした（閲覧のみの権限かもしれません）")});
    }
    lsSave();if(SBON)return sbUpsert(it);
  }
  function remove(it){
    if(!confirm("「"+it.word+"」を削除しますか？"))return;
    editingId=null;
    if(coll){coll.doc(it.id).delete().catch(function(){alert("削除できませんでした")});render()}
    else{items=items.filter(function(x){return x.id!==it.id});lsSave();if(SBON)sbDelete(it.id);render()}
  }

  /* rows: 子季語 / 例句 */
  function kidRow(box,k){
    if(typeof k==="string")k={word:k};k=k||{};
    var d=el("div","row");d.style.marginBottom="10px";
    var a=el("input");a.value=k.word||"";var b=el("input");b.value=k.yomi||"";
    d.appendChild(field("子季語",a));d.appendChild(field("読み",b));box.appendChild(d);
  }
  function kuRow(box,k){
    k=k||{};
    var d=el("div","row kurow");d.style.marginBottom="10px";
    var a=el("input");a.value=k.text||"";var b=el("input");b.value=k.by||"";
    d.appendChild(field("例句",a));d.appendChild(field("作者",b));box.appendChild(d);
  }
  function srcRow(box,s){var d=el("div");d.style.marginBottom="10px";var i=el("input");i.value=s||"";d.appendChild(field("出典 "+(box.children.length+1),i));box.appendChild(d)}
  function collectSrcs(box){var out=[],ins=box.querySelectorAll("input");for(var i=0;i<ins.length;i++){var v=ins[i].value.trim();if(v)out.push(v)}return out}
  function collectKids(box){
    var out=[],rs=box.querySelectorAll(".row");
    for(var i=0;i<rs.length;i++){var q=rs[i].querySelectorAll("input"),v=q[0].value.trim();if(v)out.push({word:v,yomi:q[1].value.trim()})}
    return out;
  }
  function collectKus(box){
    var out=[],rs=box.querySelectorAll(".row");
    for(var i=0;i<rs.length;i++){var q=rs[i].querySelectorAll("input"),v=q[0].value.trim();if(v)out.push({text:v,by:q[1].value.trim()})}
    return out;
  }

  var FIELDS=[["season","季節"],["word","季語"],["yomi","読み"],["children","子季語"],["desc","解説"],["examples","例句"],["sources","出典"],["img","画像"]];
  function kidsStr(a){return (a||[]).map(function(k){return typeof k==="string"?k:(k.yomi?k.word+"（"+k.yomi+"）":k.word)}).join("・")}
  function kusStr(a){return (a||[]).map(function(k){return k.by?k.text+"　"+k.by:k.text}).join("\n")}
  function srcStr(a){return (a||[]).map(function(s,i){return (i+1)+". "+s}).join("\n")}
  function snapOf(it){var im=it.img||"";return{season:it.season||"",word:it.word||"",yomi:it.yomi||"",children:kidsStr(it.children),desc:it.desc||"",examples:kusStr(it.examples),sources:srcStr(it.sources),img:im?"あり":"なし",_sig:im.length+":"+im.slice(-24)}}
  function hasFirst(it){return !!(it.first&&it.first.word!=null)}
  function mask(e){var p=e.split("@");return p[0].slice(0,1)+"***@"+(p[1]||"")}
  function logChange(it,before){
    var after=snapOf(it),ch=[];
    FIELDS.forEach(function(fd){
      var k=fd[0],chg=before[k]!==after[k]||(k==="img"&&before._sig!==after._sig);
      if(chg)ch.push({f:fd[1],from:before[k],to:(k==="img"&&before[k]===after[k])?"あり（差し替え）":after[k]});
    });
    if(!ch.length)return;
    if(!hasFirst(it))it.first=before;
    it.log=(it.log||[]).concat([{at:Date.now(),by:me?(me.master?"マスター":mask(me.email)):"ゲスト（ログインなし）",ch:ch}]).slice(-50);
  }
  function historyView(it){
    var e=el("div","entry");

  function hex(buf){return Array.prototype.map.call(new Uint8Array(buf),function(b){return ("0"+b.toString(16)).slice(-2)}).join("")}
  function needCrypto(){if(!window.crypto||!crypto.subtle)throw "この環境ではログインを利用できません。"}
  async function sha(s){needCrypto();return hex(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s)))}
  async function pbk(pw,saltHex){
    needCrypto();
    var key=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveBits"]);
    var salt=new Uint8Array(saltHex.match(/../g).map(function(h){return parseInt(h,16)}));
    return hex(await crypto.subtle.deriveBits({name:"PBKDF2",salt:salt,iterations:100000,hash:"SHA-256"},key,256));
  }
  function rndHex(){var a=new Uint8Array(16);crypto.getRandomValues(a);return hex(a)}

  async function register(email,pw){
    if(SBON)return sbRegister(email,pw);
    var id=await sha(email);
    if(await getUser(id))throw "このメールアドレスはすでに登録されています。";
    var salt=rndHex();
    await putUser(id,{salt:salt,hash:await pbk(pw,salt),at:Date.now()});
    setMe(email,id);
  }
  async function login(email,pw){

  }

  function doImport(list,replace){
    if(coll){
      var ps=list.map(function(it){return persist(it)});
      if(replace){
        var keep={};list.forEach(function(it){keep[it.id]=1});
        items.forEach(function(it){if(!keep[it.id])ps.push(coll.doc(it.id).delete())});
      }
      return Promise.all(ps);
    }
    var oldItems=items,map={};
    if(!replace)items.forEach(function(it){map[it.id]=it});
    list.forEach(function(it){map[it.id]=it});
    items=Object.keys(map).map(function(k){return map[k]});
    lsSave();render();
    if(SBON){
      var ps2=list.map(sbUpsert);
      if(replace){var keep2={};list.forEach(function(it){keep2[it.id]=1});oldItems.forEach(function(it){if(!keep2[it.id])ps2.push(sbDelete(it.id))})}
      return Promise.all(ps2);
    }
    return Promise.resolve();
  }

  function cropper(file,done){
    var rd=new FileReader();
    rd.onload=function(){
      var im=new Image();
      im.onload=function(){
        var S=280,OUT=360;
        var min=S/Math.min(im.width,im.height),s=min;
        var ox=(S-im.width*s)/2,oy=(S-im.height*s)/2;
        var ov=el("div","crop-ov");
        var cv=document.createElement("canvas");cv.width=cv.height=S;
        var ctx=cv.getContext("2d");
        var sl=document.createElement("input");sl.type="range";sl.min="1";sl.max="3";sl.step="0.01";sl.value="1";
        var bt=el("div","foot");var ok=el("button","btn","切り取る"),cn=el("button","link","キャンセル");
        function clamp(){ox=Math.min(0,Math.max(S-im.width*s,ox));oy=Math.min(0,Math.max(S-im.height*s,oy))}
        function draw(){clamp();ctx.fillStyle="#fff";ctx.fillRect(0,0,S,S);ctx.drawImage(im,ox,oy,im.width*s,im.height*s)}
        sl.oninput=function(){var cx=(S/2-ox)/s,cy=(S/2-oy)/s;s=min*parseFloat(sl.value);ox=S/2-cx*s;oy=S/2-cy*s;draw()};
        var dr=null;
        cv.onpointerdown=function(e){dr={x:e.clientX,y:e.clientY,ox:ox,oy:oy};cv.setPointerCapture(e.pointerId)};
        cv.onpointermove=function(e){if(!dr)return;ox=dr.ox+(e.clientX-dr.x);oy=dr.oy+(e.clientY-dr.y);draw()};
        cv.onpointerup=cv.onpointercancel=function(){dr=null};
        ok.onclick=function(){
          var o=document.createElement("canvas");o.width=o.height=OUT;var c=o.getContext("2d"),k=OUT/S;
          c.fillStyle="#fff";c.fillRect(0,0,OUT,OUT);c.drawImage(im,ox*k,oy*k,im.width*s*k,im.height*s*k);
          done(o.toDataURL("image/jpeg",0.8));document.body.removeChild(ov);
        };
        cn.onclick=function(){document.body.removeChild(ov)};
        bt.appendChild(ok);bt.appendChild(cn);
        ov.appendChild(el("p","","ドラッグで位置を、スライダーで大きさを決めてください"));
        ov.appendChild(cv);ov.appendChild(sl);ov.appendChild(bt);
        draw();document.body.appendChild(ov);
      };
      im.src=rd.result;
    };
    rd.readAsDataURL(file);
  }

    return s.join("\n").toLowerCase().indexOf(qs.toLowerCase())>=0;
  }
  function renderTabs(){
    var t=$("tabs");t.textContent="";
    SEASONS.forEach(function(s){
      var b=el("button",s===cur?"on":"",s);
      b.onclick=function(){cur=s;renderTabs();render()};
      t.appendChild(b);
    });
    var br=el("div");br.style.flexBasis="100%";t.appendChild(br);
    [["ヨコ",false],["タテ",true]].forEach(function(m){
      var b=el("button",vertical===m[1]?"on":"",m[0]);b.style.fontSize="13px";
      b.onclick=function(){vertical=m[1];try{localStorage.setItem("nyu-saijiki-vert",vertical?"1":"0")}catch(e){}renderTabs();render()};
      t.appendChild(b);
    });
    var sp=el("span");sp.style.width="16px";t.appendChild(sp);
    [["一覧",false],["ボックス",true]].forEach(function(m){
      var b=el("button",tiles===m[1]?"on":"");b.title=m[0];b.setAttribute("aria-label",m[0]);
      b.innerHTML=m[1]
        ?'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" style="vertical-align:middle"><rect x="4" y="4" width="6.5" height="6.5"/><rect x="13.5" y="4" width="6.5" height="6.5"/><rect x="4" y="13.5" width="6.5" height="6.5"/><rect x="13.5" y="13.5" width="6.5" height="6.5"/></svg>'
        :'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" style="vertical-align:middle"><path d="M4 7h16M4 12h16M4 17h16"/></svg>';
      b.onclick=function(){tiles=m[1];try{localStorage.setItem("nyu-saijiki-tiles",tiles?"1":"0")}catch(e){}renderTabs();render()};
      t.appendChild(b);
    });
  }

  function editor(it){
    var e=el("div","entry");
    var form=el("div","form");form.style.marginTop="0";
    var sel=el("select");SEASONS.forEach(function(s){sel.appendChild(el("option","",s))});sel.value=it.season;
    var w=el("input");w.value=it.word||"";
    var y=el("input");y.value=it.yomi||"";
    var row=el("div","row");row.appendChild(field("季語",w));row.appendChild(field("読み",y));
    var kids=el("div");(it.children||[]).forEach(function(k){kidRow(kids,k)});
    var addk=el("button","link","＋ 子季語を加える");addk.type="button";addk.onclick=function(){kidRow(kids)};
    var ds=el("textarea");ds.rows=10;ds.value=it.desc||"";
    var kus=el("div");(it.examples||[]).forEach(function(k){kuRow(kus,k)});
    var addu=el("button","link","＋ 句を加える");addu.type="button";addu.onclick=function(){kuRow(kus)};
    var srcs=el("div");(it.sources||[]).forEach(function(s){srcRow(srcs,s)});if(!(it.sources||[]).length)srcRow(srcs);
    var adds=el("button","link","＋ 出典を加える");adds.type="button";adds.onclick=function(){srcRow(srcs)};
    var imS={v:it.img||null};var foot=el("div","foot");
    var ok=el("button","btn","保存"),cn=el("button","link","キャンセル"),dl=el("button","link","削除");
    foot.appendChild(ok);foot.appendChild(cn);if(me&&(me.master||(it.owner&&it.owner===me.id)))foot.appendChild(dl);
    [field("季節",sel),row,kids,addk,field("解説",ds),kus,addu,srcs,adds,imgField(imS),foot].forEach(function(n){form.appendChild(n)});
    e.appendChild(form);
    ok.onclick=function(){
      var word=w.value.trim();if(!word){w.focus();return}
      var before=snapOf(it);it.season=sel.value;it.word=word;it.yomi=y.value.trim();it.desc=ds.value.trim();
      it.children=collectKids(kids);it.examples=collectKus(kus);it.sources=collectSrcs(srcs);it.img=imS.v||"";logChange(it,before);
      persist(it);editingId=null;render();
    };
    cn.onclick=function(){editingId=null;render()};
    dl.onclick=function(){remove(it)};
    return e;
  }

  function render(){
    if(page==="admin"&&!(me&&me.master))page=null;
    document.title="ニュ・歳時記";
    if(page!==null&&pgEditing===null&&pgMaster!==!!(me&&me.master))buildPage(page);
    var wa=!!(me&&me.master);if(wa!==navAdmin){navAdmin=wa;buildNav()}
    var box=$("list");box.textContent="";
    $("tabs").style.display=(editingId===null&&openId===null&&page===null&&histId===null)?"":"none";
    $("addbox").style.display=(editingId===null&&openId===null&&page===null&&histId===null)?"":"none";
    $("search").style.display=(editingId===null&&page===null)?"":"none";
    box.style.display=page===null?"":"none";
    $("pages").style.display=page===null?"none":"";
    var nb=document.querySelectorAll("#nav .dot");for(var z=0;z<nb.length;z++)nb[z].classList.toggle("on",nb[z].dataset.k===page);
    document.body.classList.toggle("v",vertical);
    box.classList.toggle("grid",tiles&&openId===null&&editingId===null&&histId===null);
    box.classList.toggle("detail",openId!==null&&editingId===null&&histId===null);
    var order={"春":1,"夏":2,"秋":3,"冬":4,"新年":5};
    var vis=items.filter(function(i){return editingId!==null?i.id===editingId:histId!==null?i.id===histId:openId!==null?i.id===openId:(qs?hit(i):i.season===cur)})
      .sort(function(a,b){return (order[a.season]-order[b.season])||String(a.yomi||a.word).localeCompare(String(b.yomi||b.word),"ja")});
    if(!vis.length&&items.length&&(editingId!==null||openId!==null||histId!==null)){editingId=null;histId=null;clearOpen();render();return}
    if(!vis.length){box.appendChild(el("div","empty",qs?"見つかりません":"まだ季語がありません"));return}
    vis.forEach(function(it){
      if(it.id===editingId){box.appendChild(editor(it));return}
      if(it.id===histId){box.appendChild(historyView(it));return}
      if(tiles&&openId===null){box.appendChild(tile(it));return}
      var e=el("div","entry");
      e.appendChild(el("span","season",it.season));
      var h2=el("h2","",it.word);
      if(openId===null){h2.style.cursor="pointer";h2.onclick=function(){openKigo(it.id)}}
      else document.title=it.word+" | ニュ・歳時記";
      e.appendChild(h2);
      if(it.yomi)e.appendChild(el("span","yomi",it.yomi));
      (it.children||[]).forEach(function(k){
        if(typeof k==="string")k={word:k};
        var s=el("span","kid");
        if(k.yomi){var r=document.createElement("ruby");r.appendChild(document.createTextNode(k.word));r.appendChild(el("rt","",k.yomi));s.appendChild(r)}
        else s.textContent=k.word;
        e.appendChild(s);
      });
      if(it.desc)e.appendChild(el("div","desc",openId!==null||it.desc.length<=60?it.desc:it.desc.slice(0,60)+"…"));
      (openId!==null?(it.examples||[]):(it.examples||[]).slice(0,1)).forEach(function(k,ki){
        var p=el("div","ku"+(ki===0?" kufirst":""),k.text);
        if(k.by)p.appendChild(el("small","",k.by));
        e.appendChild(p);
      });
      if(openId!==null&&it.sources&&it.sources.length){var sg=el("div","srcs");sg.appendChild(el("div","srchead","出典"));it.sources.forEach(function(s,i){sg.appendChild(el("div","src",(i+1)+". "+s))});e.appendChild(sg)}
      var acts=el("div","acts");
      var ed=el("button","edit");ed.type="button";ed.setAttribute("aria-label","編集");ed.title="編集";
      ed.innerHTML='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16v4z"/><path d="M13.5 6.5l4 4"/></svg>';
      ed.onclick=function(){editingId=it.id;render();window.scrollTo(0,0)};
      var hb=el("button","edit");hb.type="button";hb.setAttribute("aria-label","履歴");hb.title="履歴";
      hb.innerHTML='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="8.5"/><path d="M12 7v5l3 2"/></svg>';
      hb.onclick=function(){histId=it.id;render();window.scrollTo(0,0)};
      if(openId!==null){var bk=el("button","link","戻る");bk.onclick=closeKigo;acts.style.justifyContent="space-between";acts.appendChild(bk)}
      if(editingId===null){
        if(openId!==null){var ic=el("span");ic.style.display="flex";ic.style.gap="6px";ic.appendChild(hb);if(canEdit(it))ic.appendChild(ed);acts.appendChild(ic)}
        else{var mb=el("button","link","詳細を見る →");mb.onclick=function(){openKigo(it.id)};acts.appendChild(mb)}
        e.appendChild(acts);
      }
      if(it.img){var wr=el("div","entry hasimg");var im=el("img","thumb");im.src=it.img;im.alt="";e.className="body";wr.appendChild(im);wr.appendChild(e);box.appendChild(wr)}
      else box.appendChild(e);
    });
  }

  function resetAddForm(){
    ["f-word","f-yomi","f-desc"].forEach(function(i){$(i).value=""});
    $("f-kids").textContent="";
    $("f-kus").textContent="";kuRow($("f-kus"));$("f-srcs").textContent="";srcRow($("f-srcs"));addImg.v=null;mountImg();
  }

  $("f-save").onclick=function(){
    var word=$("f-word").value.trim();
    if(!word){$("f-word").focus();return}
    var it={
      id:"k"+Date.now().toString(36)+Math.random().toString(36).slice(2,6),
      word:word,yomi:$("f-yomi").value.trim(),season:$("f-season").value,
      desc:$("f-desc").value.trim(),children:collectKids($("f-kids")),examples:collectKus($("f-kus")),sources:collectSrcs($("f-srcs")),img:addImg.v||"",owner:me?me.id:"",at:Date.now()
    };
    it.first=snapOf(it);it.log=[];
    if(!coll)items.push(it);
    persist(it);
    resetAddForm();
    $("addbox").open=false;
    cur=it.season;renderTabs();
    if(!coll)render();
  };
  $("f-addkid").onclick=function(){kidRow($("f-kids"))};
  $("q").oninput=function(){qs=this.value.trim();clearOpen();histId=null;render()};
  var ttl=document.querySelector("h1");ttl.style.cursor="pointer";
  ttl.onclick=function(){page=null;editingId=null;histId=null;clearOpen();cur=DEF;qs="";$("q").value="";$("addbox").open=false;renderTabs();render();window.scrollTo(0,0)};
  $("f-addrow").onclick=function(){kuRow($("f-kus"))};
  $("f-addsrc").onclick=function(){srcRow($("f-srcs"))};

  kuRow($("f-kus"));
  $("navtog").onclick=function(){navOff=!navOff;try{localStorage.setItem("nyu-saijiki-navoff",navOff?"1":"0")}catch(e){}applyNav()};
  applyNav();
  srcRow($("f-srcs"));mountImg();buildNav();renderTabs();
  items=lsLoad();route();
  if(SBON)sbStart();

  var dbP=(async function(){
    try{
      if(SBON||!window.claude||!claude.use)return;
      var db=await claude.use("db");
      if(!db)return;
      coll=db.collection("kigo");userColl=db.collection("users");
      pagesColl=db.collection("pages");
      pagesColl.onSnapshot(function(snap){
        var m={};snap.docs.forEach(function(d){var x=d.data()||{};if(typeof x.body==="string")m[d.id]=x.body});
        pageTexts=m;refreshPage();
      },function(){});
      coll.onSnapshot(function(snap){
        items=snap.docs.map(function(d){var x=d.data()||{};x.id=d.id;return x});
        if(editingId===null)render();
      },function(){coll=null;items=lsLoad();render()});
    }catch(e){coll=null}
  })();
})();
</script>
</body>
